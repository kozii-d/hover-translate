    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf8f6;
        --ink: #1a1a1a;
        --muted: #5f5a56;
        --link: #c4160a;
      }
      /* Dark: the system's unless the viewer picked light, or the viewer's pick */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #141414;
          --ink: #f4f2f0;
          --muted: #a8a29e;
          --link: #ff6b5e;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #141414;
        --ink: #f4f2f0;
        --muted: #a8a29e;
        --link: #ff6b5e;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        text-align: center;
        padding-inline: max(16px, env(safe-area-inset-left))
          max(16px, env(safe-area-inset-right));
        background: var(--bg);
        color: var(--ink);
        font:
          17px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      main {
        display: grid;
        gap: 12px;
      }
      header {
        position: absolute;
        top: 18px;
        right: max(16px, env(safe-area-inset-right));
      }
      /* The theme button (theme.js), the popup's icons: a moon offers the dark theme, a sun the light one */
      .theme-toggle {
        display: inline-grid;
        place-items: center;
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .theme-toggle[hidden] {
        display: none;
      }
      .theme-toggle:hover {
        color: var(--ink);
      }
      .theme-toggle:focus-visible {
        outline: 3px solid var(--link);
        outline-offset: 2px;
      }
      .theme-toggle svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      .theme-toggle .sun {
        display: none;
      }
      :root[data-theme="dark"] .theme-toggle .sun {
        display: block;
      }
      :root[data-theme="dark"] .theme-toggle .moon {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .theme-toggle .sun {
          display: block;
        }
        :root:not([data-theme="light"]) .theme-toggle .moon {
          display: none;
        }
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
      }
      p {
        margin: 0;
      }
      a {
        color: var(--link);
        text-underline-offset: 3px;
      }
      a:focus-visible {
        outline: 3px solid var(--link);
        outline-offset: 2px;
        border-radius: 4px;
      }
    </style>
  </head>
