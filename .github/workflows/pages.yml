# Publishes site/ to GitHub Pages (https://hovertranslate.app/) as it is: no
# build. A branch can only be published from its root or docs/, hence a
# workflow. The custom domain is set in the repository's Pages settings, so
# site/ needs no CNAME.
name: Pages

on:
  push:
    branches: [master]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; one already running is let finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions pinned to a commit, the version in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # The same check as `npm run verify`, without the packages it does not need:
      # a page that loads something from another site is not published.
      - name: Check the site
        run: node scripts/check-site.js

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
